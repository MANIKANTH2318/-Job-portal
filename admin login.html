<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JobPortal</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 1rem;
        }

        .login-card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-header h2 {
            font-size: 1.8rem;
            color: #6366f1;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn-login {
            width: 100%;
            background-color: #6366f1;
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background-color: #4f46e5;
        }

        #error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.5rem;
            border-radius: 6px;
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .footer-links a {
            color: #94a3b8;
            font-size: 0.8rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Admin Secure Access</h2>
            <p>Verification required for Admin Control</p>
        </div>

        <div id="error-msg">Verification failed. Check your details.</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="username" placeholder="e.g. superadmin" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="1234567890" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@jobportal.com" required>
            </div>

            <div class="form-group">
                <label>Security Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Verify & Login</button>
        </form>

        <div class="footer-links">
            <a href="index.html">← Back to Main Website</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Getting values from the inputs
            const username = document.getElementById('username').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // These are your "Correct" credentials for the demo
            const correctUsername = "superadmin";
            const correctPhone = "1234567890";
            const correctEmail = "admin@jobportal.com";
            const correctPassword = "admin123";

            // Logic check
            if (username === correctUsername && 
                phone === correctPhone && 
                email === correctEmail && 
                password === correctPassword) {
                
                // 1. Show success message
                alert("Identity Verified! Welcome back, " + username);
                
                // 2. Redirect to the Admin Control Page (Ensure this filename is correct)
                window.location.href = "admin.html"; 
                
            } else {
                // Show error if credentials don't match
                errorMsg.style.display = "block";
                
                // Clear password field on error for security
                document.getElementById('password').value = "";
            }
        });
    </script>
</body>
</html>
